name: Purge Cloudflare cache after production deploy

# Cached HTML is bound to the build that rendered it: after any new deployment,
# client-side navigation from a stale page fetches RSC payloads from the new
# build, Next.js sees the buildId mismatch and falls back to a full reload.
# So every successful Production deployment (News pushes included) purges.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  purge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    concurrency:
      group: purge-cloudflare
      cancel-in-progress: false
    steps:
      - name: Purge entire Cloudflare zone
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "deployment: ${{ github.event.deployment.sha || github.sha }} (${{ github.event_name }})"
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "Cloudflare cache purged"
